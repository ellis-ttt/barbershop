name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh "$VPS_USER@$VPS_HOST" "mkdir -p ~/barbershop"
          scp docker-compose.yml "$VPS_USER@$VPS_HOST:~/barbershop/docker-compose.yml"

          ssh "$VPS_USER@$VPS_HOST" "
            cd ~/barbershop &&
            docker pull ghcr.io/${{ github.repository }}:latest &&
            docker tag ghcr.io/${{ github.repository }}:latest barbershop &&
            docker compose up -d --no-build --wait --wait-timeout 180 app &&
            docker compose ps &&
            docker image prune -f
          "