services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber
      POSTGRES_DB: barbershop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://barber:barber@db:5432/barbershop
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: admin
      JWT_SECRET: change-me
    depends_on:
      - db

volumes:
  pgdata:
