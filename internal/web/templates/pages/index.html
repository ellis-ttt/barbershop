{{define "content"}}
<header class="py-8">
<h1 class="text-3xl font-bold">Бритва</h1>
<p>Lorem ipsum dolor sit amet.</p>
<a href="#booking" class="inline-block mt-4 border px-4 py-2">Записаться</a>
</header>

<section class="mt-6">
<h2 class="text-xl">Услуги и цены</h2>
<ul>
{{range .Services}}<li class="flex justify-between border-b py-2"><span>{{.Name}}</span><span>{{.Price}} ₽</span></li>
{{end}}</ul>
</section>

<section class="mt-6">
<h2 class="text-xl">Мастера</h2>
<ul>
{{range .Barbers}}<li>{{.Name}}</li>
{{end}}</ul>
</section>

<section class="mt-6">
<h2 class="text-xl">Галерея</h2>
<div class="grid grid-cols-3 gap-2">
<div class="aspect-square bg-gray-200"></div>
<div class="aspect-square bg-gray-200"></div>
<div class="aspect-square bg-gray-200"></div>
</div>
</section>

<section id="booking" class="mt-6">
<h2 class="text-xl">Запись</h2>
<form method="post" action="/booking" class="grid gap-2">
<select name="service_id">{{range .Services}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select>
<select name="barber_id">{{range .Barbers}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select>
<input type="datetime-local" name="starts_at" required>
<input name="name" placeholder="Имя" required>
<input name="phone" placeholder="Телефон" required>
<button class="border px-4 py-2">Записаться</button>
</form>
</section>

<section class="mt-6">
<h2 class="text-xl">Контакты</h2>
<p>Москва, ул. Примерная, 1</p>
<p>+7 (999) 000-00-00</p>
</section>
{{end}}
