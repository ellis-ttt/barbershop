{{define "content"}}
<div class="flex justify-between">
<h1 class="text-2xl">Статистика</h1>
<a href="/admin">Записи</a>
</div>

<h2 class="text-xl mt-6">Записи по неделям</h2>
{{range .Weeks}}
<div class="flex items-center gap-2">
<span class="w-12">{{.Label}}</span>
<div class="bg-gray-800 h-4" style="width: {{pct .Count $.WeeksMax}}%"></div>
<span>{{.Count}}</span>
</div>
{{else}}<p>Пока нет данных</p>{{end}}

<h2 class="text-xl mt-6">Популярные услуги</h2>
{{range .Top}}
<div class="flex items-center gap-2">
<span class="w-40">{{.Label}}</span>
<div class="bg-gray-800 h-4" style="width: {{pct .Count $.TopMax}}%"></div>
<span>{{.Count}}</span>
</div>
{{else}}<p>Пока нет данных</p>{{end}}
{{end}}
